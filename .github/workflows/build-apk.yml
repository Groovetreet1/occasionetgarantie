name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://www.occasionetgarantie.store/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: cd 'Occasion&garantie/frontend' && npm install

      - name: Build frontend (static web)
        run: cd 'Occasion&garantie/frontend' && npm run build

      - name: Add Capacitor Android platform
        run: cd 'Occasion&garantie/frontend' && npx cap add android

      - name: Add Android permissions (location / internet)
        run: |
          MANIFEST='Occasion&garantie/frontend/android/app/src/main/AndroidManifest.xml'
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: cd 'Occasion&garantie/frontend' && npx cap sync android

      - name: Build debug APK
        run: cd 'Occasion&garantie/frontend/android' && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: occasion-garantie-app
          path: Occasion&garantie/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error